<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi d'entraînement 2026</title>
<style>
:root{--bg:#eef1ee;--card:#fff;--ink:#1b2a2f;--mute:#5d6e72;--line:#d5dcd8;--c-route:#2b6f8f;--c-trail:#c4572b;--c-velo:#d9a21b;--c-vtt:#7a8f2e;--c-nat:#3fa7a0;--c-renfo:#7d5ba6;--c-autre:#8a8f91}
@media(prefers-color-scheme:dark){:root{--bg:#121a1c;--card:#1a2427;--ink:#e6ecea;--mute:#93a5a8;--line:#2c3a3e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Avenir Next",Seravek,"Segoe UI",system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:24px 16px 60px}
h1{font:700 30px/1.1 Georgia,"Iowan Old Style",serif;margin:0 0 4px}
h2{font:600 18px Georgia,serif;margin:0 0 12px}
.sub{color:var(--mute);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi b{display:block;font:700 26px Georgia,serif}.kpi span{color:var(--mute);font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
select,input,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
button{cursor:pointer}button:hover,.chip.on{background:var(--ink);color:var(--bg)}
:focus-visible{outline:2px solid var(--c-route);outline-offset:2px}
.chip{border-radius:99px;padding:3px 12px;font-size:13px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{cursor:pointer;color:var(--mute);font-weight:600;user-select:none}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.t{white-space:normal;min-width:200px}
.cm{color:var(--mute);font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
svg text{fill:var(--mute);font-size:11px}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
details summary{cursor:pointer;font:600 18px Georgia,serif}
.rec li{margin:4px 0}
[hidden]{display:none!important}
td button{padding:1px 8px}
</style>
</head>
<body>
<main>
<h1>Suivi d'entraînement 2026</h1>
<p class="sub" id="sub"></p>
<div class="kpis" id="kpis"></div>

<div class="card">
  <h2>Volume par mois</h2>
  <div class="bar" id="metric"></div>
  <div class="wrap"><svg id="chart" width="100%" viewBox="0 0 720 240" role="img" aria-label="Volume mensuel par sport"></svg></div>
  <div class="bar" id="legend"></div>
</div>

<div class="grid2">
  <div class="card"><h2>Bilan par sport</h2><div class="wrap"><table id="bySport"></table></div></div>
  <div class="card"><h2>Faits marquants 2026</h2><ul class="rec" id="rec"></ul></div>
</div>

<div class="card">
  <h2>Séances</h2>
  <div class="bar">
    <select id="fMonth"></select><select id="fSport"></select>
    <input id="fText" type="search" placeholder="Rechercher (séance, lieu…)" aria-label="Rechercher">
    <span class="cm" id="count"></span>
  </div>
  <div class="wrap"><table id="tbl"></table></div>
</div>

<div class="card">
  <details id="addbox">
    <summary>Ajouter, modifier ou importer des séances</summary>
    <p class="cm" id="mode" style="margin:12px 0 0" hidden></p>
    <form id="add" style="margin-top:12px">
      <input type="date" name="date" required aria-label="Date">
      <select name="sport" aria-label="Sport"></select>
      <input name="duree" placeholder="Durée (h:mm:ss)" pattern="\d+:\d\d(:\d\d)?" required>
      <input name="distance" type="number" step="0.01" min="0" placeholder="Distance (km)">
      <input name="dplus" type="number" min="0" placeholder="D+ (m)">
      <input name="seance" placeholder="Séance">
      <input name="lieu" placeholder="Lieu">
      <input name="commentaire" placeholder="Commentaire">
      <button id="ok">Ajouter</button><button type="button" id="del" hidden>Supprimer</button><button type="button" id="cancel" hidden>Annuler</button>
    </form>
    <div class="bar" style="margin-top:12px">
      <label class="cm" for="imp">Compléter depuis un fichier : calendrier Excel (.xlsx) ou export Garmin Connect (Activities.csv)</label>
      <input type="file" id="imp" accept=".xlsx,.csv,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
    </div>
    <p class="cm" style="margin:12px 0 4px">Les séances sont enregistrées dans ce navigateur. L'import ajoute les séances absentes, sans toucher à celles déjà présentes.</p>
    <p class="cm" id="msg" role="status"></p>
  </details>
</div>
</main>

<script>
// Les séances sont enregistrées dans ce navigateur (localStorage). Distance en km, sauf natation en mètres.
const SPORTS = {"course route":["Course route","--c-route"],"trail":["Trail","--c-trail"],"velo route":["Vélo route","--c-velo"],"vtt":["VTT","--c-vtt"],"natation":["Natation","--c-nat"],"renfo":["Renfo","--c-renfo"],"ski rando":["Ski rando","--c-autre"],"randonnée":["Randonnée","--c-autre"]};
const MONTHS = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
const KEY = "suivi-2026-seances", OLD = "suivi-2026-modifs";
const $ = id => document.getElementById(id);
const name = k => (SPORTS[k]||[k])[0], col = k => `var(${(SPORTS[k]||[0,"--c-autre"])[1]})`;
const load = () => { try {
    const a = JSON.parse(localStorage.getItem(KEY)); if(Array.isArray(a)) return a;
    const p = JSON.parse(localStorage.getItem(OLD)); // séances saisies avec l'ancienne version de la page
    return p && p.up ? Object.values(p.up) : [];
  } catch { return []; } };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(seances)); return true; } catch { return false; } };
const parseDur = d => { const p = String(d).split(":").map(Number); return p.length===3 ? p[0]*3600+p[1]*60+p[2] : p[0]*60+(p[1]||0); };
const toObj = o => ({id:o.id,date:o.date,sport:o.sport,sec:parseDur(o.duree),dist:o.distance||0,dplus:o.dplus||0,title:o.seance||"",comment:o.commentaire||"",place:o.lieu||"",m:+o.date.slice(5,7)-1});
let seances = load().map((o,i)=>o.id?o:{...o,id:"m"+i});
let data = [], sort = {k:"date",d:-1}, metric = "h";

const hms = s => { s=Math.round(s); return `${Math.floor(s/3600)}h${String(Math.floor(s%3600/60)).padStart(2,"0")}`; };
const mmss = s => `${Math.floor(s/60)}'${String(Math.round(s%60)).padStart(2,"0")}`;
const km = s => s.sport==="natation" ? s.dist/1000 : s.dist||0;
function pace(s){
  if(!s.sec||!s.dist) return "";
  if(s.sport==="natation") return mmss(s.sec/(s.dist/100))+"/100m";
  if(s.sport==="course route"||s.sport==="trail") return mmss(s.sec/s.dist)+"/km";
  if(s.sport==="renfo") return "";
  return (s.dist/(s.sec/3600)).toFixed(1)+" km/h";
}
const fdate = d => new Date(d+"T12:00").toLocaleDateString("fr-FR",{day:"numeric",month:"short"});
const sum = (a,f) => a.reduce((t,x)=>t+f(x),0);

function render(){
  data = seances.map(toObj);
  $("sub").textContent = `${data.length} séance${data.length>1?"s":""} enregistrée${data.length>1?"s":""} · ${(n=>`${n} jour${n>1?"s":""} actif${n>1?"s":""}`)(new Set(data.map(s=>s.date)).size)}`;
  $("kpis").innerHTML = [
    [hms(sum(data,s=>s.sec)),"d'entraînement"],
    [Math.round(sum(data.filter(s=>s.sport!=="natation"),s=>s.dist||0)).toLocaleString("fr-FR")+" km","course, trail et vélo"],
    [Math.round(sum(data,s=>s.dplus||0)).toLocaleString("fr-FR")+" m","de dénivelé positif"],
    [Math.round(sum(data.filter(s=>s.sport==="natation"),s=>s.dist)/100)/10+" km","de natation"]
  ].map(k=>`<div class="kpi"><b>${k[0]}</b><span>${k[1]}</span></div>`).join("");
  chart(); bySport(); records(); table();
}

function chart(){
  $("metric").innerHTML = [["h","Heures"],["km","Kilomètres"],["d","D+ (m)"]].map(m=>`<button class="chip ${metric===m[0]?"on":""}" data-m="${m[0]}">${m[1]}</button>`).join("");
  const val = s => metric==="h"?s.sec/3600:metric==="km"?km(s):(s.dplus||0);
  const used = Object.keys(SPORTS).filter(k=>data.some(s=>s.sport===k&&val(s)>0));
  const tot = MONTHS.map((_,i)=>sum(data.filter(s=>s.m===i),val));
  const max = Math.max(1,...tot), W=720,H=240,b=26,t=14,bw=36,step=(W-40)/12;
  let g = "";
  MONTHS.forEach((mn,i)=>{
    let y = H-b; const x = 40+i*step+(step-bw)/2;
    used.forEach(k=>{
      const v = sum(data.filter(s=>s.m===i&&s.sport===k),val), h = v/max*(H-b-t);
      if(h>0){ y-=h; g+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" fill="${col(k)}"><title>${mn} · ${name(k)} : ${v.toFixed(1)}</title></rect>`; }
    });
    if(tot[i]>0) g+=`<text x="${x+bw/2}" y="${y-4}" text-anchor="middle">${Math.round(tot[i]*(metric==="h"?10:1))/(metric==="h"?10:1)}</text>`;
    g+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle">${mn.slice(0,3)}</text>`;
  });
  g+=`<line x1="36" x2="${W}" y1="${H-b}" y2="${H-b}" stroke="var(--line)"/>`;
  $("chart").innerHTML = g;
  $("legend").innerHTML = used.map(k=>`<span><i class="dot" style="background:${col(k)}"></i>${name(k)}</span>`).join("");
  document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{metric=b.dataset.m;chart();});
}

function bySport(){
  const rows = Object.keys(SPORTS).map(k=>{
    const a = data.filter(s=>s.sport===k); if(!a.length) return "";
    const d = sum(a,km), t = sum(a,s=>s.sec), dp = sum(a,s=>s.dplus||0);
    const p = pace({sport:k,sec:t,dist:k==="natation"?d*1000:d});
    return `<tr><td><i class="dot" style="background:${col(k)}"></i>${name(k)}</td><td class="n">${a.length}</td><td class="n">${hms(t)}</td><td class="n">${d?d.toFixed(0):""}</td><td class="n">${dp?Math.round(dp).toLocaleString("fr-FR"):""}</td><td class="n">${p}</td></tr>`;
  }).join("");
  $("bySport").innerHTML = `<tr><th>Sport</th><th class="n">Nb</th><th class="n">Temps</th><th class="n">km</th><th class="n">D+</th><th class="n">Moy.</th></tr>${rows}`;
}

function records(){
  const best = (f,flt=()=>true) => data.filter(flt).reduce((a,s)=>!a||f(s)>f(a)?s:a,null);
  const out = [];
  const add = (label,s,v) => s&&out.push(`<li><b>${label}</b> : ${v} — ${esc(s.title)||name(s.sport)} (${fdate(s.date)}${s.place?", "+esc(s.place):""})</li>`);
  let s = best(s=>s.dist,s=>s.sport==="trail"); add("Plus longue sortie trail",s,s&&s.dist+" km");
  s = best(s=>s.dplus||0); add("Plus gros dénivelé",s,s&&s.dplus.toLocaleString("fr-FR")+" m");
  s = best(s=>s.dist,s=>s.sport==="course route"); add("Plus longue course route",s,s&&s.dist+" km");
  s = best(s=>s.dist,s=>s.sport==="velo route"); add("Plus longue sortie vélo",s,s&&s.dist+" km");
  s = best(s=>s.dist,s=>s.sport==="natation"); add("Plus longue nage",s,s&&s.dist+" m");
  s = best(s=>s.dist/s.sec,s=>s.sport==="course route"&&s.dist>=9.9); add("Meilleure allure (≥ 10 km)",s,s&&pace(s));
  $("rec").innerHTML = out.join("");
}

function table(){
  const fm=$("fMonth").value, fs=$("fSport").value, q=$("fText").value.toLowerCase();
  let a = data.filter(s=>(fm===""||s.m==fm)&&(!fs||s.sport===fs)&&(!q||[s.title,s.comment,s.place].join(" ").toLowerCase().includes(q)));
  const v = {date:s=>s.date,sport:s=>s.sport,sec:s=>s.sec,dist:s=>km(s),dplus:s=>s.dplus||0};
  const f = v[sort.k]||v.date;
  a.sort((x,y)=>(f(x)>f(y)?1:f(x)<f(y)?-1:0)*sort.d);
  $("count").textContent = `${a.length} séance${a.length>1?"s":""} · ${hms(sum(a,s=>s.sec))} · ${Math.round(sum(a,s=>s.sport==="natation"?0:s.dist||0))} km`;
  const th = (k,l,n)=>`<th class="${n?"n":""}" data-k="${k}" tabindex="0">${l}${sort.k===k?(sort.d>0?" ▲":" ▼"):""}</th>`;
  $("tbl").innerHTML = `<tr>${th("date","Date")}${th("sport","Sport")}${th("sec","Durée",1)}${th("dist","Distance",1)}${th("dplus","D+",1)}<th class="n">Allure</th><th>Séance</th><th>Lieu</th><th></th></tr>`+
    (a.length ? "" : `<tr><td colspan="9" class="cm">${data.length ? "Aucune séance ne correspond à ces filtres." : "Aucune séance pour l'instant : ajoutez-en une ci-dessous."}</td></tr>`)+
    a.map(s=>`<tr><td>${fdate(s.date)}</td><td><i class="dot" style="background:${col(s.sport)}"></i>${name(s.sport)}</td><td class="n">${hms(s.sec)}</td><td class="n">${s.dist?(s.sport==="natation"?s.dist+" m":s.dist+" km"):""}</td><td class="n">${s.dplus||""}</td><td class="n">${pace(s)}</td><td class="t">${esc(s.title)}${s.comment?`<div class="cm">${esc(s.comment)}</div>`:""}</td><td>${esc(s.place)}</td><td><button data-e="${esc(s.id)}" aria-label="Modifier cette séance">✎</button></td></tr>`).join("");
  document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>edit(b.dataset.e));
  document.querySelectorAll("th[data-k]").forEach(h=>{const go=()=>{sort={k:h.dataset.k,d:sort.k===h.dataset.k?-sort.d:-1};table();};h.onclick=go;h.onkeydown=e=>e.key==="Enter"&&go();});
}
const esc = t => String(t||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

$("fMonth").innerHTML = `<option value="">Tous les mois</option>`+MONTHS.map((m,i)=>`<option value="${i}">${m}</option>`).join("");
$("fSport").innerHTML = `<option value="">Tous les sports</option>`+Object.keys(SPORTS).map(k=>`<option value="${k}">${name(k)}</option>`).join("");
["fMonth","fSport"].forEach(i=>$(i).onchange=table); $("fText").oninput=table;

const say = m => $("msg").textContent = m;
const NOSAVE = " Attention : ce navigateur bloque l'enregistrement local, les changements seront perdus à la fermeture de la page.";
const form = $("add"), sportSel = form.elements.sport;
sportSel.innerHTML = Object.keys(SPORTS).map(k=>`<option value="${k}">${name(k)}</option>`).join("");
sportSel.onchange = () => form.elements.distance.placeholder = sportSel.value==="natation" ? "Distance (m)" : "Distance (km)";
form.elements.date.value = new Date().toISOString().slice(0,10);

let editing = null;
const setMode = id => { editing = id; $("mode").hidden = !id; $("ok").textContent = id ? "Mettre à jour" : "Ajouter"; $("del").hidden = $("cancel").hidden = !id; };
const resetForm = d => { form.reset(); form.elements.date.value = d || new Date().toISOString().slice(0,10); sportSel.onchange(); setMode(null); };
function edit(id){
  const s = seances.find(o=>o.id===id); if(!s) return;
  const f = form.elements; f.date.value = s.date; f.sport.value = s.sport; f.duree.value = s.duree; f.distance.value = s.distance||""; f.dplus.value = s.dplus||"";
  f.seance.value = s.seance||""; f.lieu.value = s.lieu||""; f.commentaire.value = s.commentaire||"";
  sportSel.onchange(); setMode(id); $("mode").textContent = `Modification de la séance du ${fdate(s.date)}`;
  $("addbox").open = true; $("addbox").scrollIntoView({behavior:"smooth"});
}
$("cancel").onclick = () => resetForm();
form.onsubmit = e => {
  e.preventDefault(); const f = Object.fromEntries(new FormData(form));
  const id = editing || Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  const o = {id,date:f.date,sport:f.sport,duree:f.duree,distance:+f.distance||0,dplus:+f.dplus||0,seance:f.seance.trim(),commentaire:f.commentaire.trim(),lieu:f.lieu.trim()};
  const i = seances.findIndex(x=>x.id===id);
  if(i>=0) seances[i] = o; else seances.push(o);
  say((editing ? "Séance modifiée." : "Séance ajoutée.") + (save() ? "" : NOSAVE)); resetForm(f.date); render();
};
$("del").onclick = () => {
  if(!editing || !confirm("Supprimer cette séance ?")) return;
  seances = seances.filter(o=>o.id!==editing);
  say("Séance supprimée." + (save() ? "" : NOSAVE)); resetForm(); render();
};

// ---- Import de fichiers : calendrier Excel (.xlsx) ou export Garmin Connect (Activities.csv) ----
// Excel : un onglet par mois, une ligne d'en-têtes « date, sport, temps, distance, denivelé, vitesse moy, séance, commentaire, lieu »,
//   puis une ligne par séance. Les tableaux de totaux sous les séances et les onglets sans ces en-têtes (TOTAL, Record) sont ignorés.
// Garmin : colonnes « Type d'activité, Date, Titre, Distance, Durée, Ascension totale » (les autres colonnes ne sont pas lues).
const YEAR = "2026";
const norm = t => String(t??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ").trim();
const SPORT_OF = Object.fromEntries(Object.keys(SPORTS).map(k=>[norm(k),k]));
const fmtDur = sec => `${Math.floor(sec/3600)}:${String(Math.floor(sec%3600/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}`;
const kmOf = o => o.sport==="natation" ? (o.distance||0)/1000 : (o.distance||0);
// Même séance : même jour et, pour un même sport, durée (à 30 s près) ou distance (à 50 m près) identique ; les deux si le sport diffère.
const same = (x,o) => { if(x.date!==o.date) return false;
  const dt = Math.abs(parseDur(x.duree)-parseDur(o.duree))<=30, dd = kmOf(o)>0 && Math.abs(kmOf(x)-kmOf(o))<=0.0501;
  return x.sport===o.sport ? dt||dd : dt&&dd; };
const inflate = async u8 => new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
function unzip(buf){ // un .xlsx est une archive zip : on lit son répertoire central
  const dv = new DataView(buf), u8 = new Uint8Array(buf), td = new TextDecoder(), files = {};
  let e = buf.byteLength-22; while(e>=0 && dv.getUint32(e,true)!==0x06054b50) e--;
  if(e<0) throw new Error("format");
  let p = dv.getUint32(e+16,true);
  for(let i=dv.getUint16(e+10,true); i>0; i--){
    const nl = dv.getUint16(p+28,true), off = dv.getUint32(p+42,true), start = off+30+dv.getUint16(off+26,true)+dv.getUint16(off+28,true);
    files[td.decode(u8.subarray(p+46,p+46+nl))] = {deflated:dv.getUint16(p+10,true)===8, data:u8.subarray(start,start+dv.getUint32(p+20,true))};
    p += 46+nl+dv.getUint16(p+30,true)+dv.getUint16(p+32,true);
  }
  return async n => { const f = files[n]; return f ? new DOMParser().parseFromString(td.decode(f.deflated ? await inflate(f.data) : f.data),"application/xml") : null; };
}
const tags = (x,t) => x ? [...x.getElementsByTagName(t)] : [];
const colIdx = ref => { let n = 0; for(const c of ref) { if(c<"A"||c>"Z") break; n = n*26+c.charCodeAt(0)-64; } return n-1; };
async function readXlsx(buf){ // renvoie [{name, rows:[[valeurs]]}], nombres bruts (dates = n° de série Excel, durées = fraction de jour)
  const xml = unzip(buf), wb = await xml("xl/workbook.xml"); if(!wb) throw new Error("format");
  const rels = Object.fromEntries(tags(await xml("xl/_rels/workbook.xml.rels"),"Relationship").map(r=>[r.getAttribute("Id"),r.getAttribute("Target")]));
  const strings = tags(await xml("xl/sharedStrings.xml"),"si").map(si=>tags(si,"t").filter(t=>t.parentNode.localName!=="rPh").map(t=>t.textContent).join(""));
  const d1904 = /^(1|true)$/.test(tags(wb,"workbookPr")[0]?.getAttribute("date1904")||""), sheets = [];
  for(const sh of tags(wb,"sheet")){
    const t = rels[sh.getAttribute("r:id")]||"", doc = await xml(t.startsWith("/") ? t.slice(1) : "xl/"+t); if(!doc) continue;
    sheets.push({name:sh.getAttribute("name"), rows:tags(doc,"row").map(r=>{ const row = [];
      tags(r,"c").forEach((c,i)=>{ const ty = c.getAttribute("t"), v = tags(c,"v")[0]?.textContent, k = c.getAttribute("r") ? colIdx(c.getAttribute("r")) : i;
        if(ty==="inlineStr") row[k] = tags(c,"t").map(x=>x.textContent).join("");
        else if(v===undefined || v==="" || ty==="e" || ty==="b") return;
        else row[k] = ty==="s" ? strings[+v] : ty==="str" ? v : +v; });
      return row; })});
  }

const xlDate = (v,d1904) => { let m;

  if(m = String(v??"").trim().match(/^(\d{4})-(\d\d)-(\d\d)/)) return `${m[1]}-${m[2]}-${m[3]}`;
  if(m = String(v??"").trim().match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/)) return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  return null; };
const num = v => typeof v==="number" ? v : parseFloat(String(v??"").replace(",",".")) || 0;
function fromXlsx({sheets,d1904}){
  const list = [], unknown = new Set(); let bad = 0, found = false;

    const hi = sh.rows.slice(0,15).findIndex(r=>{ const h = r.map(norm); return ["date","sport","seance"].every(x=>h.includes(x)) && h.some(x=>x==="temps"||x==="duree"); });
    if(hi<0) continue;

    const cD = eq("date"), cS = eq("sport"), cT = eq("temps","duree"), cK = eq("distance"), cE = col(h=>h&&(h.startsWith("deniv")||h==="d+")), cN = eq("seance"), cC = col(h=>h&&h.startsWith("comment")), cL = eq("lieu");

      const sp = txt(r,cS), t = r[cT], sec = typeof t==="number" ? Math.round(t*86400) : /^\d+:\d\d/.test(String(t??"").trim()) ? parseDur(String(t).trim()) : 0;
      if(!sp && !sec) continue;
      if(!sec){ bad++; continue; }
      const sport = SPORT_OF[norm(sp)]; if(!sport){ unknown.add(sp||"(vide)"); continue; }
      list.push({date, sport, duree:fmtDur(sec), distance:Math.round(num(get(r,cK))*100)/100, dplus:Math.round(num(get(r,cE))), seance:txt(r,cN), commentaire:txt(r,cC), lieu:txt(r,cL)});

const parseCSV = (txt,sep) => { const rows = []; let r = [], f = "", q = false;
  for(let i=0;i<txt.length;i++){ const c = txt[i];
    if(q){ if(c==='"'){ if(txt[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if(c==='"') q = true;
    else if(c===sep){ r.push(f); f=""; }
    else if(c==="\n"||c==="\r"){ if(c==="\r"&&txt[i+1]==="\n") i++; r.push(f); f=""; rows.push(r); r=[]; }
    else f+=c; }
  if(f||r.length){ r.push(f); rows.push(r); } return rows.filter(x=>x.join("").trim()); };
// Type d'activité Garmin (français ou anglais) → sport de cette page. L'ordre compte : le premier motif trouvé gagne.
const GARMIN = [[/trail|ultra/,"trail"],[/ski.*(rando|hors|backcountry|alpinisme)/,"ski rando"],[/ski/,null],[/vtt|mountain/,"vtt"],[/cycl|velo|bik|ride/,"velo route"],
  [/natation|nat\.|swim/,"natation"],[/muscu|renfo|force|strength|hiit/,"renfo"],[/rando|marche|hik|walk/,"randonnée"],[/course|run|tapis/,"course route"]];
function fromGarmin(text){
  const first = text.split("\n")[0], sep = first.split(";").length > first.split(",").length ? ";" : ",", rows = parseCSV(text,sep), H = (rows[0]||[]).map(norm);
  const col = (...a) => H.findIndex(h=>a.some(x=>h===x||h.startsWith(x)));

  if(cT<0 || cD<0 || cM<0) throw new Error("inconnu");

  const gnum = v => { let x = String(v??"").replace(/\s/g,""); x = sep===";" ? x.replace(/\./g,"").replace(",",".") : /^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(x) ? x.replace(/,/g,"") : x.replace(",","."); return parseFloat(x) || 0; };
  const list = [], unknown = new Set(); let bad = 0;

    const type = (r[cT]||"").trim(), m = (r[cD]||"").trim().match(/^(\d{4})-(\d\d)-(\d\d)|^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if(!m) continue;
    const date = m[1] ? `${m[1]}-${m[2]}-${m[3]}` : `${m[6]}-${m[5].padStart(2,"0")}-${m[4].padStart(2,"0")}`;
    const p = (r[cM]||"").trim().split(":").map(Number), sec = p.some(isNaN) ? 0 : Math.round(p.length===3 ? p[0]*3600+p[1]*60+p[2] : p.length===2 ? p[0]*60+p[1] : 0);
    if(!sec){ bad++; continue; }
    const nt = norm(type), sport = (GARMIN.find(g=>g[0].test(nt))||[])[1]; if(!sport){ unknown.add(type||"(vide)"); continue; }
    let distance = cK<0 ? 0 : gnum(r[cK]); if(sport==="natation" && distance<50) distance *= 1000; // la page compte la natation en mètres
    const title = (cN<0 ? "" : r[cN]||"").trim(), auto = type && norm(title).endsWith(nt); // titre par défaut de Garmin : « Ville Type d'activité »
    list.push({date, sport, duree:fmtDur(sec), distance:Math.round(distance*100)/100, dplus:cE<0 ? 0 : Math.round(gnum(r[cE])), seance:auto ? "" : title, commentaire:"", lieu:auto ? title.slice(0,title.length-type.length).trim() : ""});
  }

}
$("imp").onchange = async e => {
  const file = e.target.files[0]; if(!file) return;
  try {
    const buf = await file.arrayBuffer(), u8 = new Uint8Array(buf); let res;
    if(u8[0]===0x50 && u8[1]===0x4b){ // « PK » : archive zip, donc classeur Excel
      if(!window.DecompressionStream) throw new Error("navigateur");
      res = fromXlsx(await readXlsx(buf));
    } else {
      let t = new TextDecoder().decode(u8); if(t.includes("\ufffd")) t = new TextDecoder("windows-1252").decode(u8);

    }
    const pool = seances.slice(); let added = 0, dup = 0, other = 0, n = 0;
    for(const o of res.list){
      if(o.date.slice(0,4)!==YEAR){ other++; continue; }
      const k = pool.findIndex(x=>same(x,o));
      if(k>=0){ pool.splice(k,1); dup++; continue; }
      seances.push({id:"x"+Date.now().toString(36)+(n++), ...o}); added++;
    }
    const pl = (k,a,b) => `${k} ${k>1?b:a}`;
    say(`${pl(added,"séance importée","séances importées")}, ${pl(dup,"déjà présente","déjà présentes")}.`
      + (res.unknown.size ? ` Sports non reconnus, lignes ignorées : ${[...res.unknown].join(", ")}.` : "")
      + (other ? ` ${pl(other,"séance ignorée car hors","séances ignorées car hors")} ${YEAR}.` : "")
      + (res.bad ? ` ${pl(res.bad,"ligne ignorée car sans durée","lignes ignorées car sans durée")}.` : "")
      + (added && !save() ? NOSAVE : ""));
    if(added) render();
  } catch(err) {
    say(err.message==="navigateur" ? "Ce navigateur est trop ancien pour lire les fichiers Excel. Mettez-le à jour puis réessayez."
      : "Fichier non reconnu. Il faut soit le calendrier Excel (.xlsx, un onglet par mois avec les en-têtes date, sport, temps, distance…), soit l'export Activities.csv de Garmin Connect.");
  }

render();
if(!seances.length) $("addbox").open = true;
